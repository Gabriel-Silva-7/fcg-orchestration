apiVersion: batch/v1
kind: Job
metadata:
  name: rabbitmq-bootstrap-${REVISION}
  namespace: ${NAMESPACE}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels: {app: rabbitmq-bootstrap, app.kubernetes.io/part-of: fcg}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: bootstrap
          image: ${BOOTSTRAP_IMAGE}
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          envFrom:
            - secretRef: {name: ${BOOTSTRAP_SECRET}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
