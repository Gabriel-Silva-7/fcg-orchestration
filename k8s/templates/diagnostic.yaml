apiVersion: apps/v1
kind: Deployment
metadata:
  name: diagnostic
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels: {app: diagnostic}
  template:
    metadata:
      labels: {app: diagnostic, app.kubernetes.io/part-of: fcg}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: diagnostic
          image: ${DIAGNOSTIC_IMAGE}
          imagePullPolicy: Never
          command: [sh, -c, exec sleep 3600]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 8Mi}
            limits: {cpu: 100m, memory: 32Mi}
