apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: ${NAMESPACE}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ${NAMESPACE}
spec:
  selector: {app: postgres}
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres, app.kubernetes.io/part-of: fcg}
      annotations:
        io.fcg.render-id: ${RUN_ID}
    spec:
      automountServiceAccountToken: false
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: postgres
          image: ${POSTGRES_IMAGE}
          imagePullPolicy: Never
          command: [/opt/fcg/postgres/entrypoint.sh]
          args: [postgres]
          envFrom:
            - configMapRef: {name: ${CONFIG_NAME}}
            - secretRef: {name: ${PG_SECRET}}
          ports: [{name: postgres, containerPort: 5432}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          startupProbe:
            exec: {command: [/opt/fcg/postgres/healthcheck.sh]}
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: {command: [/opt/fcg/postgres/healthcheck.sh]}
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec: {command: [pg_isready, -q, -h, "127.0.0.1", -U, fcg_bootstrap, -d, postgres]}
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: scripts, mountPath: /opt/fcg/postgres, readOnly: true}
            - {name: scripts, mountPath: /docker-entrypoint-initdb.d/10-fcg.sh, subPath: 10-init.sh, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: postgres-data}
        - name: scripts
          configMap: {name: ${SCRIPTS_NAME}, defaultMode: 365}
