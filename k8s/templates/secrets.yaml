# Template only. Values are rendered into a PRIVATE directory; never apply this source file.
apiVersion: v1
kind: Secret
metadata:
  name: ${PG_SECRET}
  namespace: ${NAMESPACE}
type: Opaque
stringData:
  POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD}
  FCG_USERS_DB_PASSWORD: ${USERS_DB_PASSWORD}
  FCG_CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD}
  FCG_PAYMENTS_DB_PASSWORD: ${PAYMENTS_DB_PASSWORD}
  FCG_NOTIFICATIONS_DB_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD}
---
apiVersion: v1
kind: Secret
metadata:
  name: ${MQ_SECRET}
  namespace: ${NAMESPACE}
type: Opaque
stringData:
  RABBITMQ_DEFAULT_PASS: ${MQ_ADMIN_PASSWORD}
---
apiVersion: v1
kind: Secret
metadata:
  name: ${BOOTSTRAP_SECRET}
  namespace: ${NAMESPACE}
type: Opaque
stringData:
  RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
  RABBITMQ_BOOTSTRAP_TIMEOUT_SECONDS: "60"
  RABBITMQ_BOOTSTRAP_USER: ${MQ_ADMIN_USER}
  RABBITMQ_BOOTSTRAP_PASSWORD: ${MQ_ADMIN_PASSWORD}
  FCG_USERS_RABBITMQ_USER: ${USERS_MQ_USER}
  FCG_USERS_RABBITMQ_PASSWORD: ${USERS_MQ_PASSWORD}
  FCG_CATALOG_RABBITMQ_USER: ${CATALOG_MQ_USER}
  FCG_CATALOG_RABBITMQ_PASSWORD: ${CATALOG_MQ_PASSWORD}
  FCG_PAYMENTS_RABBITMQ_USER: ${PAYMENTS_MQ_USER}
  FCG_PAYMENTS_RABBITMQ_PASSWORD: ${PAYMENTS_MQ_PASSWORD}
  FCG_NOTIFICATIONS_RABBITMQ_USER: ${NOTIFICATIONS_MQ_USER}
  FCG_NOTIFICATIONS_RABBITMQ_PASSWORD: ${NOTIFICATIONS_MQ_PASSWORD}
